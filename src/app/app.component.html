<app-header></app-header>


<main>
    <ul id="users">
        @for (user of users; track user.id) {
            <li>
                <app-user [user]="user" [selected]="selectedUser?.id === user.id" (select)="onSelectUser($event)"/>
            </li>
        } 
    </ul>

    @if (selectedUser) {
        <app-tasks [selectedUserName]="selectedUser.name" [selectedUserId]="selectedUser.id"></app-tasks>
    } @else {
        <p id="fallback">Select a user to view their tasks.</p>
    }
</main>
